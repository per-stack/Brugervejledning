name: Byg og udgiv GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer MkDocs Material
        run: pip install mkdocs-material

      - name: Forbered indhold
        run: |
          mkdir site-src
          cp -r ./* site-src/ 2>/dev/null || true
          rm -rf site-src/.git site-src/.github site-src/mkdocs.yml site-src/README.md site-src/site

      - name: Generér manglende indekssider
        run: |
          python3 - <<'EOF'
          import os, glob
          root = "site-src"
          for dirpath, dirnames, filenames in os.walk(root):
              if "index.md" in [f.lower() for f in filenames]:
                  continue
              mds = sorted(glob.glob(os.path.join(dirpath, "*.md")))
              subs = sorted(
                  d for d in dirnames
                  if glob.glob(os.path.join(dirpath, d, "*.md"))
              )
              if not mds and not subs:
                  continue
              title = os.path.basename(dirpath) or "Indhold"
              lines = [f"# {title}", "", "Vælg en side herunder:", ""]
              for m in mds:
                  name = os.path.splitext(os.path.basename(m))[0]
                  lines.append(f"- {name}")
              for s in subs:
                  lines.append(f"- [{s}]({s}/)")
              with open(os.path.join(dirpath, "index.md"), "w", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")
          EOF

      - name: Byg site
        run: mkdocs build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
