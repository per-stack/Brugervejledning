site_name: FejerPro Brugervejledning
site_description: Brugervejledninger til FejerPro
docs_dir: site-src
site_dir: site

extra_css:
  - extra.css

theme:
  name: material
  language: da
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Skift til mørkt tema
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Skift til lyst tema

plugins:
  - search:
      lang: da

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
